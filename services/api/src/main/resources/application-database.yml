spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:my_forever_music}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true

server:
  port: ${API_PORT:8081}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO
    io.myforevermusic.api.modules.platform.infrastructure.spotify: DEBUG
    io.myforevermusic.api.modules.ems: DEBUG
