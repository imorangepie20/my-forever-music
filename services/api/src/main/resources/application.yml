spring:
  application:
    name: my-forever-music-api
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:my_forever_music}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: my-forever-music-api
    version: ${APP_VERSION:0.1.0-SNAPSHOT}
    description: Spring Boot API scaffold for My Forever Music

app:
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    recommendation-preview-path: ${AI_RECOMMENDATION_PREVIEW_PATH:/v1/recommendations/preview}

logging:
  level:
    io.myforevermusic.api: INFO
