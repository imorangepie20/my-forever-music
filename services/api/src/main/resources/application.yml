spring:
  application:
    name: my-forever-music-api
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:my_forever_music}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: my-forever-music-api
    version: ${APP_VERSION:0.1.0-SNAPSHOT}
    description: Spring Boot API scaffold for My Forever Music

app:
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    recommendation-preview-path: ${AI_RECOMMENDATION_PREVIEW_PATH:/v1/recommendations/preview}
  audio-features:
    reccobeats:
      enabled: ${RECCOBEATS_ENABLED:true}
      base-url: ${RECCOBEATS_API_BASE_URL:https://api.reccobeats.com/v1}
  platform:
    lastfm:
      enabled: ${LASTFM_ENABLED:false}
      api-key: ${LASTFM_API_KEY:}
      shared-secret: ${LASTFM_SHARED_SECRET:}
      api-root: ${LASTFM_API_ROOT:https://ws.audioscrobbler.com/2.0/}
    oauth:
      spotify:
        enabled: ${SPOTIFY_OAUTH_ENABLED:false}
        client-id: ${SPOTIFY_CLIENT_ID:}
        client-secret: ${SPOTIFY_CLIENT_SECRET:}
        redirect-uri: ${SPOTIFY_REDIRECT_URI:http://localhost:5173/platforms/oauth/callback}
        authorization-uri: ${SPOTIFY_AUTHORIZATION_URI:https://accounts.spotify.com/authorize}
        token-uri: ${SPOTIFY_TOKEN_URI:https://accounts.spotify.com/api/token}
        api-base-uri: ${SPOTIFY_API_BASE_URI:https://api.spotify.com/v1}
        scopes:
          - user-read-email
          - playlist-read-private
          - playlist-read-collaborative
      tidal:
        enabled: ${TIDAL_OAUTH_ENABLED:false}
        client-id: ${TIDAL_CLIENT_ID:}
        client-secret: ${TIDAL_CLIENT_SECRET:}
        redirect-uri: ${TIDAL_REDIRECT_URI:http://localhost:5173/platforms/oauth/callback}
        authorization-uri: ${TIDAL_AUTHORIZATION_URI:https://login.tidal.com/authorize}
        token-uri: ${TIDAL_TOKEN_URI:https://auth.tidal.com/v1/oauth2/token}
        api-base-uri: ${TIDAL_API_BASE_URI:https://openapi.tidal.com/v2}
        country-code: ${TIDAL_COUNTRY_CODE:US}
        scopes: ${TIDAL_SCOPES:}

logging:
  level:
    io.myforevermusic.api: INFO
